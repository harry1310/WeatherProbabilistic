name: 5a-multiprocess-smoke

# Throwaway timing experiment — derisks the multiprocess-chains plan
# from WB/docs/PER_CELL_4A_PLAN.md's sibling 5a discussion (2026-05-10).
#
# Question: does firing N separate Python subprocesses on a CI runner
# deliver OS-level parallelism in a way pmap-on-CPU clearly does not?
#
# Setup: same data pull + JAX verify as retrain-python.yml's 5a path.
# Then runs the experiment in three phases:
#
#   Phase A (reference, sequential): one --chain-seed 0 worker. Captures
#     the single-chain wall on this runner. (~12-15 min at 200 draws /
#     200 tune / 8-feat default — repeat of smoke-1 from earlier today.)
#
#   Phase B (2-way parallel): TWO --chain-seed workers in shell `&`.
#     If real OS parallelism: wall ≈ 1.0-1.1 × Phase A.
#     If BLAS thread thrashing or shared physical core: wall ≈ 2 × A.
#
#   Phase C (4-way parallel): FOUR workers. Same comparison: should be
#     ~1.0-1.3 × Phase A if pmap-equivalent parallelism works, ~4 × if
#     fully serialised, somewhere in between for partial parallelism.
#
# BLAS env vars (OMP_/MKL_/OPENBLAS_NUM_THREADS=1, XLA single device)
# pin each subprocess to single-threaded compute so the OS scheduler
# can dispatch the N processes to N cores without thread contention.
#
# Cost: ~3× the single-chain wall in the worst case (A + B + C
# back-to-back) = ~45-60 min total runner time. Acceptable for a
# one-off diagnostic. Workflow is throwaway — delete once we have the
# answer.

on:
  workflow_dispatch:
    inputs:
      add_spread_features:
        description: "Match production: 10-feat spread variant. Default off."
        required: false
        default: false
        type: boolean
      sampler_draws:
        description: "Draws per chain (default 200 for fast smoke)."
        required: false
        default: "200"
        type: string
      sampler_tune:
        description: "Tune per chain (default 200 for fast smoke)."
        required: false
        default: "200"
        type: string

# Distinct concurrency group so this can run alongside retrain-python.
concurrency:
  group: weatherprobabilistic-5a-mp-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Single-threaded BLAS so OS-level parallelism is what we measure,
    # not "N processes × N threads each contending for the same pool".
    # XLA single-device because we DON'T want JAX virtualising 4 devices
    # inside each subprocess (each subprocess only does 1 chain anyway).
    env:
      OMP_NUM_THREADS:      "1"
      MKL_NUM_THREADS:      "1"
      OPENBLAS_NUM_THREADS: "1"
      XLA_FLAGS:            "--xla_force_host_platform_device_count=1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify single-thread BLAS + JAX device count
        run: |
          python -c "
          import jax, numpy as np
          print(f'JAX devices: {jax.devices()}')
          assert len(jax.devices()) == 1, 'expected 1 device with single-device XLA_FLAGS'
          print('BLAS threading env:')
          import os
          for k in ['OMP_NUM_THREADS','MKL_NUM_THREADS','OPENBLAS_NUM_THREADS']:
              print(f'  {k}={os.environ.get(k)}')
          # np.show_config() dumps BLAS lib + nominal thread setting
          np.show_config()
          "

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull data trees from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ../WeatherBlend/data/forecasts/location=bonehill_rocks
          for m in gfs_seamless ecmwf_ifs025 icon_seamless meteofrance_seamless gem_seamless ecmwf_aifs025_single jma_seamless; do
            rclone copy "r2:${R2_BUCKET}/data/forecasts/location=bonehill_rocks/model=$m" \
              "../WeatherBlend/data/forecasts/location=bonehill_rocks/model=$m" \
              --fast-list --transfers 16 --checkers 32
          done
          mkdir -p ../WeatherBlend/data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" \
            ../WeatherBlend/data/truth/rainfall \
            --fast-list --transfers 16 --checkers 32

      - name: Phase A — 1 worker (reference wall)
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
        run: |
          SPREAD=""
          if [ "${{ inputs.add_spread_features }}" = "true" ]; then SPREAD="--add-spread-features"; fi
          DRAWS="${{ inputs.sampler_draws }}"
          TUNE="${{ inputs.sampler_tune }}"
          mkdir -p reports/mp_smoke/phase_a
          T0=$(date -u +%s)
          python -u scripts/run_phase5_bayesian.py $SPREAD \
            --chains 1 --draws $DRAWS --tune $TUNE \
            --chain-seed 0 \
            --output-path reports/mp_smoke/phase_a/chain_0.nc
          T1=$(date -u +%s)
          echo "PHASE_A_WALL_S=$((T1-T0))" | tee -a $GITHUB_ENV

      - name: Phase B — 2 parallel workers
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
        run: |
          SPREAD=""
          if [ "${{ inputs.add_spread_features }}" = "true" ]; then SPREAD="--add-spread-features"; fi
          DRAWS="${{ inputs.sampler_draws }}"
          TUNE="${{ inputs.sampler_tune }}"
          mkdir -p reports/mp_smoke/phase_b
          T0=$(date -u +%s)
          # Two workers in parallel via shell `&`, redirect each to its
          # own log file so output isn't interleaved unreadably. `wait`
          # blocks until both exit.
          python -u scripts/run_phase5_bayesian.py $SPREAD \
            --chains 1 --draws $DRAWS --tune $TUNE \
            --chain-seed 0 \
            --output-path reports/mp_smoke/phase_b/chain_0.nc \
            > reports/mp_smoke/phase_b/chain_0.log 2>&1 &
          PID0=$!
          python -u scripts/run_phase5_bayesian.py $SPREAD \
            --chains 1 --draws $DRAWS --tune $TUNE \
            --chain-seed 1 \
            --output-path reports/mp_smoke/phase_b/chain_1.nc \
            > reports/mp_smoke/phase_b/chain_1.log 2>&1 &
          PID1=$!
          wait $PID0 $PID1
          T1=$(date -u +%s)
          echo "PHASE_B_WALL_S=$((T1-T0))" | tee -a $GITHUB_ENV
          echo "=== Phase B chain_0 tail ==="; tail -30 reports/mp_smoke/phase_b/chain_0.log
          echo "=== Phase B chain_1 tail ==="; tail -30 reports/mp_smoke/phase_b/chain_1.log

      - name: Phase C — 4 parallel workers
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
        run: |
          SPREAD=""
          if [ "${{ inputs.add_spread_features }}" = "true" ]; then SPREAD="--add-spread-features"; fi
          DRAWS="${{ inputs.sampler_draws }}"
          TUNE="${{ inputs.sampler_tune }}"
          mkdir -p reports/mp_smoke/phase_c
          T0=$(date -u +%s)
          PIDS=()
          for SEED in 0 1 2 3; do
            python -u scripts/run_phase5_bayesian.py $SPREAD \
              --chains 1 --draws $DRAWS --tune $TUNE \
              --chain-seed $SEED \
              --output-path reports/mp_smoke/phase_c/chain_${SEED}.nc \
              > reports/mp_smoke/phase_c/chain_${SEED}.log 2>&1 &
            PIDS+=($!)
          done
          wait "${PIDS[@]}"
          T1=$(date -u +%s)
          echo "PHASE_C_WALL_S=$((T1-T0))" | tee -a $GITHUB_ENV
          for s in 0 1 2 3; do
            echo "=== Phase C chain_$s tail ==="
            tail -15 reports/mp_smoke/phase_c/chain_${s}.log
          done

      - name: Summarise wall times
        if: always()
        run: |
          A=${PHASE_A_WALL_S:-0}; B=${PHASE_B_WALL_S:-0}; C=${PHASE_C_WALL_S:-0}
          {
            echo "## 5a multiprocess smoke results"
            echo ""
            echo "| Phase | Workers | Wall (s) | Wall (min) | Ratio vs Phase A |"
            echo "|---|---:|---:|---:|---:|"
            if [ $A -gt 0 ]; then
              echo "| A (reference)   | 1 | $A | $(awk "BEGIN{printf \"%.1f\",$A/60}") | 1.00× |"
            fi
            if [ $B -gt 0 ] && [ $A -gt 0 ]; then
              echo "| B (2 parallel)  | 2 | $B | $(awk "BEGIN{printf \"%.1f\",$B/60}") | $(awk "BEGIN{printf \"%.2f×\",$B/$A}") |"
            fi
            if [ $C -gt 0 ] && [ $A -gt 0 ]; then
              echo "| C (4 parallel)  | 4 | $C | $(awk "BEGIN{printf \"%.1f\",$C/60}") | $(awk "BEGIN{printf \"%.2f×\",$C/$A}") |"
            fi
            echo ""
            echo "**Interpretation:**"
            echo "- Ratio ≈ 1.0× → genuine OS-level parallelism (each subprocess on its own core, no contention)."
            echo "- Ratio ≈ N× → fully serialised (multiprocess didn't help; same wall as sequential)."
            echo "- Ratio between → partial parallelism (fewer physical cores than vCPUs, BLAS thread leakage, or memory pressure)."
          } | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload traces + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5a-mp-smoke-${{ github.run_id }}
          path: reports/mp_smoke/
          retention-days: 7
          if-no-files-found: warn
