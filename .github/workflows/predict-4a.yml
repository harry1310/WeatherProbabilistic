name: predict-4a

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Phase 4a (dbarts BART) PREDICT — loads the saved state bundle minted
# by retrain-python.yml (phase 4a), applies it to fresh live forecast
# features, writes
# predictions parquet under the existing version. Runs 4× per day on the
# Cloudflare 03/09/15/21 UTC tick.
#
# Pre-split this workflow ALSO trained on each daily run (~24 min wall).
# Now training is its own workflow; the predict cycle just rehydrates
# the saved state via warm-scaffold + setState (~30s wall) and predicts.
# See scripts/train_4a.py + scripts/predict_4a.py for the load mechanics,
# and scripts/smoke_dbarts_roundtrip.py for the verified round-trip.
#
# Failure path: WorkflowRun completed events with conclusion=failure
# trigger the cross-repo /github-webhook handler in the Cloudflare
# scheduler-worker, which auto-files a `[ci-fail] predict-4a` issue
# under the `ci-failure` label.

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "Anchor date YYYY-MM-DD (UTC). Empty = today."
        required: false
        type: string
      stations:
        description: "Comma-separated station slugs (default: all 3 active)."
        required: false
        type: string

concurrency:
  # Per-anchor serialisation via the cron group keeps two close-together
  # cycles from racing each other on R2 reads.
  group: weatherprobabilistic-4a
  cancel-in-progress: false

jobs:
  predict-4a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R + dbarts
        # rpy2 + dbarts must be present even at predict time — the warm
        # scaffold is built via dbarts::bart() then setState injects the
        # saved trees. ABI-mode rpy2 dlopens libR at import time so we
        # need the same libtirpc-dev + python3-dev pair as the train job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base r-base-dev libtirpc-dev python3-dev
          R --version
          mkdir -p ~/R/x86_64-pc-linux-gnu-library/4.4
          echo 'R_LIBS_USER=~/R/x86_64-pc-linux-gnu-library/4.4' >> ~/.Renviron
          R -e 'install.packages("dbarts", repos="https://cloud.r-project.org", lib=Sys.getenv("R_LIBS_USER"))'
          R -e 'library(dbarts); cat("dbarts version:", as.character(packageVersion("dbarts")), "\n")'

      - name: Install Python deps
        env:
          RPY2_CFFI_MODE: ABI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'rpy2<3.6'

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Fetch WeatherBlend config.yaml from R2
        # src.weatherblend_config imports at module load time and reads
        # this file to derive STATIONS_BY_LOCATION / STATION_NAME_BY_SLUG.
        # WeatherBlend's previous-runs-refresh.yml publishes config.yaml
        # to r2:${R2_BUCKET}/config/ on every tick (same bus + cadence
        # as phases.yaml). Loader falls back to a sibling checkout for
        # local dev but in CI this fetch is required.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ./config
          rclone copy "r2:${R2_BUCKET}/config/config.yaml" ./config/ --checkers 4

      - name: Pull predict data (sync_train_data.sh MODE=predict)
        # Single source of truth for what 4a reads at predict time:
        # forecasts + EA rainfall (antecedent-rain features) + static
        # orographic (oro_* terrain features) + the latest phase4a bundle
        # per station. Declared once in scripts/sync_train_data.sh and shared
        # with the train pull + the smoke, so predict can't silently drift
        # from what the rich-oro builder reads (the 2026-05-31 failure was
        # this workflow hand-rolling a stale subset). MODE=predict skips the
        # truth-as-label-only trees + the promote MANIFEST.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # PREDICT_PULL_ANCHOR pins the predict-mode date window (anchor
          # -14d..+6d, default today) for retro-dated dispatches.
          MODE=predict R2_SOURCE="r2:${R2_BUCKET}" \
            PREDICT_PULL_ANCHOR="${{ github.event.inputs.anchor }}" \
            bash scripts/sync_train_data.sh bonehill_rocks 4a

      - name: Run Phase 4a state-load + predict
        # Per-cell BART: loads N states per station (one per lead),
        # ~1-2 min per station, ~5 min total for 3 stations. The
        # find_latest_bundle in predict_4a.py filters out old lead-
        # pooled bundles (no state_lead_NNh.rds files); if no per-
        # cell bundle exists yet on a station, that station is
        # skipped with a warning and the run carries on.
        # continue-on-error: between code deploy and the first per-
        # cell retrain landing, no station has a usable bundle — let
        # the workflow exit cleanly rather than failing the cron.
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          R_HOME: /usr/lib/R
          R_LIBS_USER: /home/runner/R/x86_64-pc-linux-gnu-library/4.4
          RPY2_CFFI_MODE: ABI
        run: |
          ANCHOR="${{ github.event.inputs.anchor }}"
          STATIONS="${{ github.event.inputs.stations }}"
          ARGS=""
          if [ -n "$ANCHOR" ]; then ARGS="$ARGS --anchor $ANCHOR"; fi
          if [ -n "$STATIONS" ]; then
            STATIONS_LIST=$(echo "$STATIONS" | tr ',' ' ')
            ARGS="$ARGS --stations $STATIONS_LIST"
          fi
          python -u scripts/predict_4a.py $ARGS

      - name: Push Phase 4a predictions to R2
        # Predictions only — bundle dirs are retrain-python.yml's (4a) territory.
        # Multiple predict cycles writing under the same model_version
        # but different date= partitions is the intended pattern; same-
        # day overwrites are idempotent.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/predictions/precipitation \
            "r2:${R2_BUCKET}/data/predictions/precipitation" \
            --include '**/model_version=*phase4a*/**' \
            --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: predict-4a-${{ github.run_id }}
          path: |
            *.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
