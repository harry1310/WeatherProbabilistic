name: predict-4b

# Phase 4b PREDICT — synthesises the 2-way arithmetic mean of phase 4a
# and phase 3e P(wet) for each (station, valid_time, lead) where both
# components have a fresh prediction. Identified as the best
# production stack in the 2026-05-12 LightGBM-meta bake-off (mean
# Brier 0.0830, wins 14/15 station,lead cells).
#
# Not a trained model — see ``scripts/mint_4b_bundle.py`` for the
# one-time bundle minter and ``scripts/predict_4b.py`` for the
# per-cycle synthesis. This workflow just runs predict_4b.py on a
# 2-hourly cron offset 30 min after predict-and-render so the
# freshest 3e parquets have already landed on R2.
#
# Failure path: WorkflowRun completed events with conclusion=failure
# trigger the cross-repo /github-webhook handler in the Cloudflare
# scheduler-worker, which auto-files a `[ci-fail] predict-4b` issue.

on:
  workflow_dispatch:
    inputs:
      for_date:
        description: "Anchor date YYYY-MM-DD (UTC). Empty = latest on disk."
        required: false
        type: string
      stations:
        description: "Comma-separated station slugs (default: 3 Bonehill stations)."
        required: false
        type: string

concurrency:
  group: weatherprobabilistic-4b
  cancel-in-progress: false

jobs:
  predict-4b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # 4b is light — just pandas + pyarrow + duckdb. No rpy2, no R.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow duckdb numpy

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull latest 4a + 3e predictions + MANIFEST from R2
        # Only the two phases we need to synthesise from. include filters
        # the precipitation prediction tree to just 4a + 3e + 4b
        # (4b for the in-day merge with prior cycles' rows).
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ../WeatherBlend/data/predictions/precipitation
          rclone copy "r2:${R2_BUCKET}/data/predictions/precipitation" \
            ../WeatherBlend/data/predictions/precipitation \
            --include '**/model_version=*phase4a*/**' \
            --include '**/model_version=*phase3e*/**' \
            --include '**/model_version=*phase4b*/**' \
            --fast-list --transfers 16 --checkers 32
          mkdir -p ../WeatherBlend/data/models/precipitation
          rclone copyto "r2:${R2_BUCKET}/data/models/precipitation/MANIFEST.json" \
            ../WeatherBlend/data/models/precipitation/MANIFEST.json

      - name: Run Phase 4b synthesis
        # Soft-skip exit code 3 (predict_4b returns it when no station
        # produced output, typically because 4a or 3e is missing for the
        # target date). Same convention as predict-4a / predict-5a so the
        # Cloudflare scheduler doesn't fire a false-positive [ci-fail].
        continue-on-error: true
        run: |
          FOR_DATE="${{ github.event.inputs.for_date }}"
          STATIONS="${{ github.event.inputs.stations }}"
          ARGS="--predictions-root ../WeatherBlend/data/predictions \
                --models-root ../WeatherBlend/data/models/precipitation"
          if [ -n "$FOR_DATE" ]; then ARGS="$ARGS --for-date $FOR_DATE"; fi
          if [ -n "$STATIONS" ]; then ARGS="$ARGS --stations $STATIONS"; fi
          python -u scripts/predict_4b.py $ARGS

      - name: Push Phase 4b predictions to R2
        # Predictions only — bundle dirs are mint_4b_bundle.py's
        # territory (runs post-retrain, not per-cycle).
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/predictions/precipitation \
            "r2:${R2_BUCKET}/data/predictions/precipitation" \
            --include '**/model_version=*phase4b*/**' \
            --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-4b-${{ github.run_id }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
