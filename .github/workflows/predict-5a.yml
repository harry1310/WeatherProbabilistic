name: predict-5a

# Phase 5a (Bayesian logistic regression) live predict.
#
# Reads the live forecast tree from R2 (written by WeatherBlend's collect.yml),
# applies the Phase 5a lead-as-feature partial-pooling Bayesian posterior
# bundle (live_bundle/ + posteriors/) saved in this repo's reports/ tree,
# emits per-row P(wet) + credible-interval columns into the standard
# predictions tree at data/predictions/precipitation/{station}/
# model_version=v..._phase5a/. Metadata (training_metadata.json +
# feature_schema.json) lands at data/models/precipitation/{station}/
# v..._phase5a/. WeatherBlend's LoadModelSummaries discovers 5a alongside
# 4a; the prediction-line gating decides what to render.
#
# Sequencing per 6h slot (HH ∈ {2, 8, 14, 20}; matches WeatherBlend's
# scheduler-worker so the chain runs end-to-end on one cron tick):
#
#   HH:30      collect.yml (WeatherBlend)              Open-Meteo + ERA5 + METAR + EA + MO DataHub
#   HH:45      s3-collect.yml (WeatherBlend)           Raw S3 cycles
#   HH:55      predict-5a.yml (THIS workflow)          5a Bayesian predictions + metadata -> R2
#   HH+1:15    predict-and-render.yml (WeatherBlend)   Reads everything and renders site
#
# Cloudflare scheduler-worker dispatches this. GitHub-side `schedule:` not
# used (per project policy in WeatherBlend memory:
# project_scheduling_cloudflare_only). Manual dispatch retained for testing
# and one-off backfills.

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "Anchor date YYYY-MM-DD (UTC). Empty = today."
        required: false
        type: string

concurrency:
  # Per-anchor concurrency. We don't share a lock with WeatherBlend because
  # the only filesystem we both touch is R2 and 5a writes are additive
  # (under its own model_version=*phase5a* prefix), so they can't conflict
  # with WeatherBlend's predictions tree writes. Distinct from
  # weatherprobabilistic-4a (BART) so 4a + 5a can run in parallel.
  group: weatherprobabilistic-5a
  cancel-in-progress: false

jobs:
  predict-5a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # Pin matches the local .venv. predict_5a is pure-Python at runtime
        # (loads the persisted INLA posterior NetCDF via arviz, scaler.pkl
        # via sklearn) — no R / INLA install needed here. The R-INLA fit
        # only happens at TRAINING time in retrain-python.yml.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull live forecast tree from R2 (5 models the Bayesian needs)
        # Only the models the Bayesian posterior was trained on. Each
        # model's tree is ~30-50 MB at this scale; fetching all 5 is well
        # under a minute.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ../WeatherBlend/data/forecasts/location=bonehill_rocks
          for m in ecmwf_ifs025 gem_seamless gfs_seamless icon_seamless meteofrance_seamless; do
            rclone copy "r2:${R2_BUCKET}/data/forecasts/location=bonehill_rocks/model=$m" \
              "../WeatherBlend/data/forecasts/location=bonehill_rocks/model=$m" \
              --fast-list --transfers 16 --checkers 32
          done

      - name: Pull 5a bundle from R2
        # Mirrors the pattern predict-4a.yml uses (rclone copy
        # r2:.../data/models/precipitation ...). The bundle is the
        # canonical posterior + scaler + metadata produced by
        # retrain-python.yml's "Push 5a bundle to R2" step. Pulling it
        # here means: (a) the bundle binaries don't need to live in git,
        # and (b) auto-retrain → R2 → predict picks up a fresh posterior
        # on the next cron tick without any commit-back step. ~5 MiB
        # total (posterior NetCDF ~450 KB + small metadata + scaler),
        # comfortably sub-second.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ./reports/phase5a_artefacts/live_bundle
          mkdir -p ./reports/phase5a_artefacts/posteriors
          rclone copy "r2:${R2_BUCKET}/reports/phase5a_artefacts/live_bundle" \
            ./reports/phase5a_artefacts/live_bundle \
            --fast-list --transfers 16 --checkers 32
          rclone copy "r2:${R2_BUCKET}/reports/phase5a_artefacts/posteriors" \
            ./reports/phase5a_artefacts/posteriors \
            --fast-list --transfers 16 --checkers 32

      - name: Run Phase 5a (Bayesian logistic regression) live predict
        # Single lead-as-feature partial-pool posterior, scored against the
        # live forecast tree. One posterior call per station rather than
        # per (station, lead). Predictions land under
        # data/predictions/precipitation/{station}/model_version=v..._phase5a/.
        # Per-station training_metadata.json + feature_schema.json are
        # written by extend_5a.py at TRAIN time (retrain-python.yml's
        # "Push 5a per-station metadata to R2" step), so this script is
        # predictions-only.
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
        run: |
          ANCHOR="${{ github.event.inputs.anchor }}"
          if [ -n "$ANCHOR" ]; then
            python -u scripts/predict_5a.py --anchor "$ANCHOR"
          else
            python -u scripts/predict_5a.py
          fi

      - name: Push 5a predictions to R2
        # data/predictions/precipitation/{station}/model_version=v..._phase5a/
        # is WeatherBlend's GetPrecipitationPredictions scanner prefix.
        # data/models/.../v..._phase5a/ no longer pushed from here —
        # extend_5a.py writes it at train time, retrain-python.yml pushes it.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/predictions/precipitation \
            "r2:${R2_BUCKET}/data/predictions/precipitation" \
            --include '**/model_version=*phase5a*/**' \
            --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-5a-${{ github.run_id }}
          path: |
            *.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
