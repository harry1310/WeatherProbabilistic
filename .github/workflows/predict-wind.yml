name: predict-wind

env:
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Phase 2 wind_mvn PREDICT (direction) + wind_speed_lgb PREDICT (speed
# point + CQR band) — both Python wind models share this job: same
# forecast pull, same orographic JSON, same ~30s dep install.
# (Renamed from predict-wind-direction 2026-06-10 — it has covered speed
# as well as direction since the wind_speed_lgb Option B cutover.)
#
# Cloudflare scheduler-worker chain (extended Hop C dispatches BOTH
# predict-4a AND this workflow in parallel via Promise.allSettled, both
# triggered by collect.yml's completion). No new hop — same trigger as 4a.
#
# predict_wind_mvn.py reads:
#   - data/forecasts/location=bonehill_rocks (for the 29-feature live vector)
#   - data/models/wind_direction/bonehill_rocks/{v_wind_mvn}/ (per-lead
#     state_lead_{24,48,72}h.pt + feature_scaler.json + calibration.json)
# and writes:
#   - data/predictions/wind_direction/{location}/model_version={v}_wind_mvn/
#       date={anchor}/predictions.parquet
#
# predict_wind_speed_pi.py (Option B cutover 2026-06-10 — replaced the
# .NET WindSpeedLgbPredictPipeline) reads the same forecast tree plus
#   - data/models/wind/{location}/{v}_wind_speed_lgb/ (q_lo/q_med/q_hi
#     boosters + calibration.json)
# and writes the EXACT ElementPredictionRow layout the .NET pipeline did
# (q50 = BlendValue) plus the CQR band sidecar (BandLoMs/BandHiMs/ConformalQ):
#   - data/predictions/wind/model_version={v}_wind_speed_lgb/
#       date={anchor}/predictions.parquet     (NO location subdir — element tree)
#
# wind_blend (the speed-blend composition consuming both wind trees)
# runs in WeatherBlend's predict-tail, NOT here — it reaches these rows
# via sync-render-inputs' full data/predictions pull. Same flow as 4b
# minting from 4a + 3o. Ordering is safe by construction: this workflow
# is Hop C (~HH:53); WB's predict (Hop D) runs ~HH+1:10.
#
# Failure path: same /github-webhook handler in the Cloudflare
# scheduler-worker that watches predict-4a opens a
# `[ci-fail] predict-wind` issue under `ci-failure` on a
# failed run.

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "Anchor date YYYY-MM-DD (UTC). Empty = today."
        required: false
        type: string
      location:
        description: "Location slug. Default: bonehill_rocks."
        required: false
        type: string

concurrency:
  # Independent R2 prefix (wind_direction/) — separate lock from
  # predict-4a (precipitation/) and predict-3f (rainfall_amount/).
  group: weatherprobabilistic-wind
  cancel-in-progress: false

jobs:
  predict-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # torch + duckdb + numpy/pandas only — no NGBoost, no PyMC.
        # torch>=2.10 resolves to the CPU wheel on Linux without
        # a NVIDIA index configured. Tiny MLP (~6k params); install
        # cost dominates the runtime, ~30s vs <10s predict wall.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Fetch WeatherBlend config.yaml from R2
        # Same R2 bus pattern as predict-4a / predict-3f —
        # src.weatherblend_config reads this at import time.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ./config
          rclone copy "r2:${R2_BUCKET}/config/config.yaml" ./config/ --checkers 4

      - name: Pull predict data (sync_train_data.sh MODE=predict)
        # Single source of truth: forecasts + static orographic + the latest
        # wind_mvn AND wind_speed_lgb bundles, declared once in
        # scripts/sync_train_data.sh (shared with train + smoke). MODE=predict
        # skips MIDAS truth (the train-only label) + the promote MANIFESTs.
        # The script pulls the full NWP union (vs the old 6-model list) —
        # harmless, both predictors filter to their own NWP set at
        # feature-build (over-pull cheap, under-pull drops columns).
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          LOC="${{ github.event.inputs.location }}"
          [ -z "$LOC" ] && LOC="bonehill_rocks"
          MODE=predict R2_SOURCE="r2:${R2_BUCKET}" \
            bash scripts/sync_train_data.sh "$LOC" wind_mvn,wind_speed_lgb

      - name: Run wind_mvn predict
        # ~10s wall for ~72 rows (3 leads × 24 valid_times).
        # continue-on-error: when no bundle is on R2 yet (first time
        # this workflow runs, before the first Sunday retrain), the
        # script exits 3 cleanly — let the workflow surface that as
        # a soft skip rather than a hard fail.
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          WB_LOCATION: ${{ github.event.inputs.location || 'bonehill_rocks' }}
        run: |
          ANCHOR="${{ github.event.inputs.anchor }}"
          LOC="${{ github.event.inputs.location || 'bonehill_rocks' }}"
          ARGS="--location $LOC"
          if [ -n "$ANCHOR" ]; then ARGS="$ARGS --anchor $ANCHOR"; fi
          python -u scripts/predict_wind_mvn.py $ARGS

      - name: Run wind_speed_lgb predict (q50 point + CQR band)
        # ~5s wall for ~72 rows (3 leads × 24 valid_times) — three LightGBM
        # boosters per lead, no torch involved. Same soft-fail contract as
        # wind_mvn above: no *_wind_speed_lgb bundle on R2 yet (pre-first-
        # retrain) → predict raises/exits non-zero, continue-on-error masks
        # it, and the push step's directory guard skips the upload. The .NET
        # wind_blend mint then soft-skips its cycle (exit 2/3 path) — the
        # champion wind line still renders.
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          WB_LOCATION: ${{ github.event.inputs.location || 'bonehill_rocks' }}
        run: |
          ANCHOR="${{ github.event.inputs.anchor }}"
          LOC="${{ github.event.inputs.location || 'bonehill_rocks' }}"
          ARGS="--location $LOC"
          if [ -n "$ANCHOR" ]; then ARGS="$ARGS --anchor $ANCHOR"; fi
          python -u scripts/predict_wind_speed_pi.py $ARGS

      - name: Push predictions to R2
        # wind_direction is a fresh prefix on first push — --s3-no-check-bucket
        # avoids the IAM-token CreateBucket gotcha.
        #
        # Soft-skip guard: when no wind_mvn bundle is on R2 yet (pre-first-
        # Sunday-retrain), `Run wind_mvn predict` exits non-zero and
        # continue-on-error masks it — but `continue-on-error` doesn't skip
        # SUBSEQUENT steps, so without this guard rclone tries to copy a
        # directory predict never created and the workflow fails with
        # "directory not found" (2026-05-28 incident). The directory check
        # below silent-skips the push when there's nothing to upload,
        # which matches the workflow's intended "soft-skip until first
        # bundle exists" semantics end-to-end.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          PRED_ROOT=../WeatherBlend/data/predictions/wind_direction
          if [ -d "$PRED_ROOT" ] && [ -n "$(find "$PRED_ROOT" -name '*.parquet' -print -quit 2>/dev/null)" ]; then
            rclone copy "$PRED_ROOT" \
              "r2:${R2_BUCKET}/data/predictions/wind_direction" \
              --include '**/model_version=*wind_mvn*/**' \
              --fast-list --transfers 16 --checkers 32 --progress --s3-no-check-bucket
          else
            echo "::notice::No wind_direction predictions produced this cycle (likely no *_wind_mvn bundle on R2 yet) — skipping R2 push."
          fi

          # wind_speed_lgb rows live in the element tree (predictions/wind/,
          # no location subdir) — same directory guard, scoped to the
          # *_wind_speed_lgb model_version dirs so the .NET-written champion
          # wind + wind_blend dirs in the same tree are never touched.
          # ROOTED include (leading /): the model_version= dirs sit at the
          # COPY ROOT here, and rclone's '**/x' needs at least one parent
          # segment — the wind_direction push above only matches because its
          # tree has a {location}/ level. The unrooted form silently pushed
          # NOTHING on the first live cycle (2026-06-10 08:53Z run:
          # "Transferred: 0 B, Checks: 0/0, Listed 87").
          WIND_ROOT=../WeatherBlend/data/predictions/wind
          if [ -d "$WIND_ROOT" ] && [ -n "$(find "$WIND_ROOT" -path '*wind_speed_lgb*' -name '*.parquet' -print -quit 2>/dev/null)" ]; then
            rclone copy "$WIND_ROOT" \
              "r2:${R2_BUCKET}/data/predictions/wind" \
              --include '/model_version=*wind_speed_lgb*/**' \
              --fast-list --transfers 16 --checkers 32 --progress --s3-no-check-bucket
          else
            echo "::notice::No wind_speed_lgb predictions produced this cycle (likely no *_wind_speed_lgb bundle on R2 yet) — skipping R2 push."
          fi

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: predict-wind-${{ github.run_id }}
          path: |
            *.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
