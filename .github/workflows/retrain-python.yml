name: retrain-python

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Phase 2 of AUTO_RETRAIN_PLAN.md (slice 1) — manual-dispatch retrain
# of WeatherProbabilistic Python phases (4a BART, 3f NGBoost-LogNormal)
# with per-phase configurability.
#
# `phases` input lets the user pick which phases to retrain. "all" runs
# every impl=python phase in phases.yaml.
#
# Cost ballpark on ubuntu-latest (4 vCPU):
#   - 4a only: ~75-120 min (3 stations × 5 leads, ~5-8 min each BART fit)
#   - 3f only: ~10-15 min
#   - all:     ~85-135 min

on:
  # Automated path (Sunday): WeatherBlend's previous-runs-refresh fires
  # this on its own success when the Cloudflare worker passes it
  # train_after_refresh=true (the worker only sets that on Sundays).
  # client_payload carries phases + add_spread_features so the same
  # payload shape works for manual-dispatch overrides.
  repository_dispatch:
    types: [retrain]
  # Manual path: user fires from CLI / Actions UI. force=true (default)
  # bypasses any gate.
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases to retrain. 'all' = every impl=python phase in WeatherBlend's config/phases.yaml (fetched from R2). Examples: '4a', '3f', '4a,3f'."
        required: false
        default: "all"
        type: string
      anchor:
        description: "Anchor date YYYY-MM-DD UTC for the version string. Empty = today."
        required: false
        type: string
      force:
        description: "Run regardless of trigger source (manual override). Default true."
        required: false
        default: true
        type: boolean

concurrency:
  # One slot per phases tuple. Production retrains share the same key per
  # `phases` so the Sunday cron never runs two simultaneous fits that
  # race for the R2 push slot.
  group: weatherprobabilistic-retrain-${{ inputs.phases }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Job-level timeout fires before GitHub's default 360 min in case
    # anything stalls.
    timeout-minutes: 180
    strategy:
      # One job per location. SERIAL (max-parallel: 1): each job pushes the
      # shared precipitation MANIFEST.json, so a parallel job 2 would
      # overwrite job 1's just-pushed manifest. Today 4a is
      # bonehill_rocks-only in phases.yaml, so the membury job resolves to
      # no phases and is a fast no-op — but the matrix is here so adding
      # membury to 4a's `locations:` later needs no workflow edit.
      max-parallel: 1
      fail-fast: false
      matrix:
        location: [bonehill_rocks, membury_devon]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (recover ~17 GB from preinstalled tooling)
        # ubuntu-latest's / partition is 72 GB total but ~73% full at
        # baseline (.NET / Android / CodeQL / Haskell / Chrome / Edge
        # SDKs we don't need). Free some up so the R install + Python
        # deps fit comfortably.
        run: |
          echo "--- df -h before cleanup ---"
          df -h /
          sudo rm -rf /usr/share/dotnet              || true
          sudo rm -rf /usr/local/lib/android         || true
          sudo rm -rf /opt/ghc                       || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL    || true
          sudo rm -rf /opt/google/chrome             || true
          sudo rm -rf /opt/microsoft/msedge          || true
          sudo apt-get clean
          echo "--- df -h after cleanup ---"
          df -h /

      - name: Decide whether to proceed
        # Gate kept simple now that Cloudflare owns the cadence rule. Three
        # ways this workflow fires; each unambiguously decides:
        #   - repository_dispatch: WB previous-runs-refresh fired us after
        #     a successful Sunday refresh. Cloudflare already gated the
        #     Sunday check at dispatch time. Proceed.
        #   - workflow_dispatch + force=true (default): manual run, user
        #     intent to retrain regardless. Proceed.
        #   - workflow_dispatch + force=false: rare opt-out, e.g. testing
        #     the workflow's wiring without the 3-hour sample. Skip.
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            echo "Triggered via repository_dispatch (Sunday auto-trigger from WB previous-runs-refresh) — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual dispatch with force=true — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::workflow_dispatch with force=false — exiting cleanly (no training)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- rclone setup (moved up so the phase-decide step can fetch
      # phases.yaml from R2 before deciding which phases to run) -----------

      # rclone install + R2 remote + config.yaml fetch — single source of
      # truth in .github/actions/setup-r2 since 2026-06-11. (config.yaml is
      # re-fetched in the next step too — harmless 1s duplicate; that step
      # keeps the phases.yaml fetch + the run-log summaries.)
      - uses: ./.github/actions/setup-r2
        if: steps.gate.outputs.proceed == 'true'
        with:
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
          bucket: ${{ secrets.R2_BUCKET }}

      - name: Fetch phases.yaml + config.yaml from R2
        # WeatherBlend's previous-runs-refresh workflow pushes
        # src/WeatherBlend/Config/phases.yaml + src/WeatherBlend/config.yaml
        # to r2:${R2_BUCKET}/config/ on every refresh tick, so both are
        # always recent. Cross-repo canonical config without checking
        # out WeatherBlend. config.yaml feeds src.weatherblend_config
        # (loaded at import time of src.data) so STATIONS_BY_LOCATION /
        # STATION_NAME_BY_SLUG stay in sync with WB's location +
        # rainfall.stations lists without a parallel WP edit.
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ./config
          rclone copy "r2:${R2_BUCKET}/config/phases.yaml" ./config/ --checkers 4
          rclone copy "r2:${R2_BUCKET}/config/config.yaml" ./config/ --checkers 4
          echo "----- phases.yaml -----"
          cat ./config/phases.yaml
          echo "----- config.yaml (locations + station summary) -----"
          # Just the location names + station counts — full file is verbose.
          yq -r '.locations[] | "\(.name): \([.rainfall.stations[].name] | length) stations"' ./config/config.yaml

      - name: Decide which phases to run
        # phases.yaml (fetched from R2) is the single source of truth for
        # which models run for which locations. Each impl=python phase
        # carries an optional `locations:` filter (absent = every location);
        # run_<id> is true only when the phase is requested AND this matrix
        # location admits it.
        #
        # 4a is bonehill_rocks-only and 3f is membury_devon-only in
        # phases.yaml today, so each matrix job runs exactly the phase(s)
        # admitted by its location. Extend by adding the location to the
        # phase's `locations:` in phases.yaml, NOT by editing this workflow.
        #
        # NOTE: each phase still needs its own concrete "Train <id>" run
        # block below. Adding 5b: (1) edit phases.yaml in WB, (2) add a
        # run_5b case + a `Train 5b` step here.
        id: phases
        if: steps.gate.outputs.proceed == 'true'
        env:
          PHASES_DISPATCH: ${{ inputs.phases }}
          PHASES_PAYLOAD: ${{ github.event.client_payload.phases }}
          MATRIX_LOCATION: ${{ matrix.location }}
        run: |
          # yq is pre-installed on ubuntu-latest (mikefarah/yq).
          PHASES_YAML=./config/phases.yaml
          # One "id|loc1,loc2" row per TRAINED impl=python phase (empty = all
          # locations). retrain:none phases are predict-time-only (no train
          # step) and are excluded — mirrors retrain-blenders.yml.
          mapfile -t PHASE_ROWS < <(yq -r '
            .targets | to_entries[].value.phases[]
            | select(.impl == "python")
            | select((.retrain // "") != "none")
            | .id + "|" + ((.locations // []) | join(","))
          ' "$PHASES_YAML")
          PYTHON_PHASES=$(printf '%s\n' "${PHASE_ROWS[@]}" | cut -d'|' -f1 | paste -sd, -)
          echo "impl=python phases from phases.yaml: $PYTHON_PHASES"
          echo "Matrix location: $MATRIX_LOCATION"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT="${PHASES_PAYLOAD:-all}"
          else
            INPUT="${PHASES_DISPATCH:-all}"
          fi
          if [ "$INPUT" = "all" ]; then INPUT="$PYTHON_PHASES"; fi
          echo "Requested phase list: $INPUT"

          # Validate input against phases.yaml — anything in INPUT that
          # isn't in PYTHON_PHASES is an unknown phase. Catches typos
          # ("5b" before adding 5b to the YAML) and hardcoded "5z" tests.
          IFS=',' read -ra REQUESTED <<< "$INPUT"
          IFS=',' read -ra KNOWN <<< "$PYTHON_PHASES"
          for p in "${REQUESTED[@]}"; do
            found=false
            for k in "${KNOWN[@]}"; do
              if [ "$p" = "$k" ]; then found=true; break; fi
            done
            if [ "$found" = "false" ]; then
              echo "::error::Phase '$p' is not in phases.yaml's impl=python list (have: $PYTHON_PHASES). Add it to phases.yaml first."
              exit 1
            fi
          done

          # run_<id> = requested AND admitted by this matrix location.
          run_4a=false; run_3f=false; run_wind_mvn=false; run_wind_speed_lgb=false
          for row in "${PHASE_ROWS[@]}"; do
            id="${row%%|*}"
            locs="${row#*|}"
            requested=false
            case ",$INPUT," in *",${id},"*) requested=true ;; esac
            applies=false
            if [ -z "$locs" ]; then
              applies=true
            else
              case ",$locs," in *",${MATRIX_LOCATION},"*) applies=true ;; esac
            fi
            if [ "$requested" = "true" ] && [ "$applies" = "true" ]; then
              case "$id" in
                4a) run_4a=true ;;
                3f) run_3f=true ;;
                wind_mvn) run_wind_mvn=true ;;
                wind_speed_lgb) run_wind_speed_lgb=true ;;
                *) echo "::warning::phases.yaml impl=python phase '$id' has no Train step wired in retrain-python.yml — add run_${id} + a Train step." ;;
              esac
            fi
          done
          echo "run_4a=$run_4a" >> "$GITHUB_OUTPUT"
          echo "run_3f=$run_3f" >> "$GITHUB_OUTPUT"
          echo "run_wind_mvn=$run_wind_mvn" >> "$GITHUB_OUTPUT"
          echo "run_wind_speed_lgb=$run_wind_speed_lgb" >> "$GITHUB_OUTPUT"
          echo "Resolved: run_4a=$run_4a run_3f=$run_3f run_wind_mvn=$run_wind_mvn run_wind_speed_lgb=$run_wind_speed_lgb"

          # CSV of resolved phases — consumed by scripts/sync_train_data.sh
          # so the per-phase pull declarations are the same source of truth
          # the smoke tests use. Empty = no pulls + train steps all skip.
          RESOLVED_CSV=""
          [ "$run_4a"             = "true" ] && RESOLVED_CSV="${RESOLVED_CSV:+$RESOLVED_CSV,}4a"
          [ "$run_3f"             = "true" ] && RESOLVED_CSV="${RESOLVED_CSV:+$RESOLVED_CSV,}3f"
          [ "$run_wind_mvn"       = "true" ] && RESOLVED_CSV="${RESOLVED_CSV:+$RESOLVED_CSV,}wind_mvn"
          [ "$run_wind_speed_lgb" = "true" ] && RESOLVED_CSV="${RESOLVED_CSV:+$RESOLVED_CSV,}wind_speed_lgb"
          echo "phases_resolved_csv=$RESOLVED_CSV" >> "$GITHUB_OUTPUT"
          echo "phases_resolved_csv='$RESOLVED_CSV'"

          if [ -z "$RESOLVED_CSV" ]; then
            echo "::notice::No python phases run for location '$MATRIX_LOCATION' — this matrix job is a no-op (heavy install + train steps all skip)."
          fi

      - uses: actions/setup-python@v5
        # Short-circuit when no phases resolve for this matrix location
        # (e.g. manual dispatch of --phases 4a on the membury job, or a
        # future location added to the matrix that no phase yet admits).
        # setup-python is ~5–10 s but the Install Python deps step below
        # is ~30 s and ~1 GB of wheels — both wasted on a no-op matrix
        # job. The Fetch phases.yaml step already runs (it uses
        # pre-installed yq/bash), and the gate step has already emitted
        # the "::notice::No python phases run …" line.
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        with:
          python-version: "3.12"

      # R is needed by 4a (dbarts). Only installed when 4a runs.
      - name: Install R
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4a == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base r-base-dev libtirpc-dev python3-dev
          R --version
          mkdir -p ~/R/x86_64-pc-linux-gnu-library/4.4
          echo 'R_LIBS_USER=~/R/x86_64-pc-linux-gnu-library/4.4' >> ~/.Renviron

      - name: Install dbarts (4a)
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4a == 'true'
        run: |
          R -e 'install.packages("dbarts", repos="https://cloud.r-project.org", lib=Sys.getenv("R_LIBS_USER"))'
          R -e 'library(dbarts); cat("dbarts version:", as.character(packageVersion("dbarts")), "\n")'

      - name: Install Python deps
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        env:
          RPY2_CFFI_MODE: ABI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.phases.outputs.run_4a }}" = "true" ]; then
            # rpy2<3.6 because rpy2 3.6+ references R_getVar (R 4.5+)
            # which Ubuntu 24.04's r-base 4.4 doesn't expose.
            pip install 'rpy2<3.6'
          fi

      - name: Pull data trees from R2
        # Per-phase pull declarations live in scripts/sync_train_data.sh —
        # the SAME script the smoke tests invoke against a local fake-R2
        # dir. Adding a new pull for a phase = one edit there; smoke +
        # production stay in lockstep. Skipped on a no-op matrix location.
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.phases_resolved_csv != ''
        env:
          R2_SOURCE: "r2:${{ secrets.R2_BUCKET }}"
          MATRIX_LOCATION: ${{ matrix.location }}
          RESOLVED_PHASES: ${{ steps.phases.outputs.phases_resolved_csv }}
        run: bash scripts/sync_train_data.sh "$MATRIX_LOCATION" "$RESOLVED_PHASES"

      - name: Train 4a (BART, per-cell)
        # 3 stations × 5 leads = 15 BART fits per run, ~5-8 min each
        # on a 4-vCPU runner. Total wall: ~75-120 min. Per-cell
        # architecture replaced the lead-pooled 4a 2026-05-11 (see
        # train_4a.py module docstring).
        id: train_4a
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4a == 'true'
        # continue-on-error so a 4a failure doesn't strand a successful
        # 3f bundle (and vice versa). The aggregator step re-fails the
        # job if either phase broke.
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          # train_4a.py reads WB_LOCATION (src/data.py ACTIVE_LOCATION).
          WB_LOCATION: ${{ matrix.location }}
          R_HOME: /usr/lib/R
          R_LIBS_USER: /home/runner/R/x86_64-pc-linux-gnu-library/4.4
          RPY2_CFFI_MODE: ABI
        run: |
          ANCHOR="${{ inputs.anchor }}"
          ARGS=""
          if [ -n "$ANCHOR" ]; then ARGS="--anchor $ANCHOR"; fi
          python -u scripts/train_4a.py $ARGS

      - name: Train 3f (NGBoost-LogNormal, per-cell)
        # 3 Membury stations × 5 leads = 15 NGBoost fits per run. Per-cell
        # wall is ~30-60s for the 500-tree default + early stopping;
        # total ~10-15 min for the full sweep. Membury-only — phases.yaml's
        # locations: ["membury_devon"] filter on the rainfall_amount/3f
        # entry means the Bonehill matrix job resolves run_3f=false and
        # this step skips entirely for that job.
        id: train_3f
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_3f == 'true'
        # continue-on-error so a 3f failure doesn't strand a successful
        # 4a push (or vice versa). Aggregator re-fails the job.
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          WB_LOCATION: ${{ matrix.location }}
        run: |
          ANCHOR="${{ inputs.anchor }}"
          ARGS=""
          if [ -n "$ANCHOR" ]; then ARGS="--anchor $ANCHOR"; fi
          python -u scripts/train_3f.py $ARGS

      - name: Train wind_mvn (PyTorch MLP bivariate-normal)
        # 1 location × 3 leads = 3 MLP fits per run. Per-cell wall is
        # ~1-3 min (300-epoch cap, early-stop typically around epoch
        # 110-150). Total ~5-10 min. Bonehill-only initially (Membury
        # Dunkeswell paired rows not yet validated — plan open item #4).
        # phases.yaml's wind_direction/wind_mvn locations: ["bonehill_rocks"]
        # filter means the Membury matrix job resolves run_wind_mvn=false
        # and this step skips entirely for that job.
        id: train_wind_mvn
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_wind_mvn == 'true'
        # continue-on-error so a wind_mvn failure doesn't strand 4a / 3f
        # bundles (and vice versa).
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          WB_LOCATION: ${{ matrix.location }}
        run: |
          python -u scripts/train_wind_mvn.py --location ${{ matrix.location }}

      - name: Train wind_speed_lgb (quantile-LGB + cross-conformal CQR)
        # 1 location × 3 leads, each = 3 quantile heads + K=10 cross-conformal
        # folds × 2 sides. Total wall ~5-10 min. The Python port of the .NET
        # WindSpeedLgbBlender (Option B cutover 2026-06-10): one model owns
        # the q50 point AND the calibrated 90% band. --conformal crossconf is
        # the finalized production mode (pooled-OOF coverage 90%, walk-forward
        # production-regime coverage ~88-89%); --build required is the default.
        # Bonehill-only via phases.yaml's locations: filter, same as wind_mvn.
        id: train_wind_speed_lgb
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_wind_speed_lgb == 'true'
        # continue-on-error so a wind_speed_lgb failure doesn't strand the
        # other phases' bundles (and vice versa).
        continue-on-error: true
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          WB_LOCATION: ${{ matrix.location }}
        run: |
          python -u scripts/train_wind_speed_pi.py --location ${{ matrix.location }} --conformal crossconf

      # ----- R2 auto-push ------------------------------------------------
      # R2 sync is incremental, gated on each train step's success (the
      # guard exited 4 if data drifted, in which case write_bundle never
      # ran and there's nothing to sync).

      - name: Push 4a bundles to R2
        # Gated on 4a's OWN outcome, not job-wide success() — a failed
        # 3f must not strand 4a's freshly-trained bundles.
        if: steps.phases.outputs.run_4a == 'true' && steps.train_4a.outcome == 'success'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/precipitation \
            "r2:${R2_BUCKET}/data/models/precipitation" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*phase4a*/**"

      - name: Push 3f bundles to R2
        # train_3f.py writes per-(station, lead) NGBoost pickles +
        # preprocess + metadata under
        # ../WeatherBlend/data/models/rainfall_amount/{station}/v..._phase3f/.
        # rainfall_amount is its own target tree (separate from
        # precipitation/), so the push targets r2:.../rainfall_amount.
        # First run on a fresh tree the R2 prefix doesn't exist yet —
        # --s3-no-check-bucket flag suppresses the CreateBucket probe
        # that the rclone IAM token can't satisfy (same pattern as
        # other first-push steps in the codebase).
        if: steps.phases.outputs.run_3f == 'true' && steps.train_3f.outcome == 'success'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/rainfall_amount \
            "r2:${R2_BUCKET}/data/models/rainfall_amount" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*phase3f*/**"

      - name: Push wind_mvn bundles to R2
        # train_wind_mvn.py writes per-lead torch state dicts + scaler +
        # calibration + metadata under
        # ../WeatherBlend/data/models/wind_direction/{location}/v..._wind_mvn/.
        # First push to wind_direction/ needs --s3-no-check-bucket (fresh
        # prefix, same IAM gotcha).
        if: steps.phases.outputs.run_wind_mvn == 'true' && steps.train_wind_mvn.outcome == 'success'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/wind_direction \
            "r2:${R2_BUCKET}/data/models/wind_direction" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*wind_mvn*/**"

      - name: Push wind_speed_lgb bundles to R2
        # train_wind_speed_pi.py writes per-lead q_lo/q_med/q_hi LightGBM
        # boosters + feature_schema + calibration + training_metadata +
        # training_summary under
        # ../WeatherBlend/data/models/wind/{location}/v..._wind_speed_lgb/.
        # The wind/ target tree already exists on R2 (the .NET-era bundles
        # live there) but keep --s3-no-check-bucket like every other push.
        if: steps.phases.outputs.run_wind_speed_lgb == 'true' && steps.train_wind_speed_lgb.outcome == 'success'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/wind \
            "r2:${R2_BUCKET}/data/models/wind" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*wind_speed_lgb*/**"

      - name: Push MANIFEST.json to R2
        # train_4a.py + train_3f.py + train_wind_mvn.py all promote the
        # freshly-trained version into the local MANIFEST.json's Active
        # list (added 2026-05-12 — see manifest_promote.py module
        # docstring for why; root-cause was "no 4a on site since midday
        # May 10" symptom). The bundle-push steps above use --include
        # filters scoped to phase subtrees, so MANIFEST.json (at each
        # target's root) wouldn't be picked up by either. This step does
        # the explicit manifest push for each target tree any phase
        # promoted into.
        if: (steps.phases.outputs.run_4a == 'true' && steps.train_4a.outcome == 'success') || (steps.phases.outputs.run_3f == 'true' && steps.train_3f.outcome == 'success') || (steps.phases.outputs.run_wind_mvn == 'true' && steps.train_wind_mvn.outcome == 'success') || (steps.phases.outputs.run_wind_speed_lgb == 'true' && steps.train_wind_speed_lgb.outcome == 'success')
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -f ../WeatherBlend/data/models/precipitation/MANIFEST.json ]; then
            rclone copyto ../WeatherBlend/data/models/precipitation/MANIFEST.json \
              "r2:${R2_BUCKET}/data/models/precipitation/MANIFEST.json" \
              --s3-no-check-bucket
            echo "Pushed precipitation/MANIFEST.json to R2."
          else
            echo "::warning::precipitation/MANIFEST.json not found locally."
          fi
          if [ -f ../WeatherBlend/data/models/rainfall_amount/MANIFEST.json ]; then
            rclone copyto ../WeatherBlend/data/models/rainfall_amount/MANIFEST.json \
              "r2:${R2_BUCKET}/data/models/rainfall_amount/MANIFEST.json" \
              --s3-no-check-bucket
            echo "Pushed rainfall_amount/MANIFEST.json to R2."
          fi
          if [ -f ../WeatherBlend/data/models/wind_direction/MANIFEST.json ]; then
            rclone copyto ../WeatherBlend/data/models/wind_direction/MANIFEST.json \
              "r2:${R2_BUCKET}/data/models/wind_direction/MANIFEST.json" \
              --s3-no-check-bucket
            echo "Pushed wind_direction/MANIFEST.json to R2."
          fi
          if [ -f ../WeatherBlend/data/models/wind/MANIFEST.json ]; then
            rclone copyto ../WeatherBlend/data/models/wind/MANIFEST.json \
              "r2:${R2_BUCKET}/data/models/wind/MANIFEST.json" \
              --s3-no-check-bucket
            echo "Pushed wind/MANIFEST.json to R2."
          fi

      - name: Aggregate retrain results
        # The train steps are continue-on-error so the push steps can
        # decouple (a failed phase no longer strands a good one). This step
        # re-fails the job — so the [ci-fail] webhook still fires — if any
        # phase actually broke. Skipped phases (outcome=skipped) don't count.
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          failed=()
          if [ "${{ steps.train_4a.outcome }}" = "failure" ]; then failed+=("4a"); fi
          if [ "${{ steps.train_3f.outcome }}" = "failure" ]; then failed+=("3f"); fi
          if [ "${{ steps.train_wind_mvn.outcome }}" = "failure" ]; then failed+=("wind_mvn"); fi
          if [ "${{ steps.train_wind_speed_lgb.outcome }}" = "failure" ]; then failed+=("wind_speed_lgb"); fi
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Retrain failed for phase(s): ${failed[*]}. Passing phases were still pushed to R2 — inspect each failed phase's log above."
            exit 1
          fi
          echo "All requested phases trained + pushed."

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-python-logs-${{ github.run_id }}
          path: |
            *.log
            reports/*.log
          retention-days: 7
          if-no-files-found: ignore
