name: retrain-python

# Phase 2 of AUTO_RETRAIN_PLAN.md (slice 1) — manual-dispatch retrain
# of WeatherProbabilistic Python phases (4a BART, 5a Bayesian logreg)
# with per-phase configurability.
#
# Slice 1 scope:
#   - workflow_dispatch trigger only (no auto-firing yet — workflow_run
#     across repos needs repository_dispatch wiring; that's slice 3).
#   - `phases` input lets the user pick which phases to retrain. "all"
#     runs both; "5a" or "4a" runs just one. Useful for the user's
#     overnight 5a test that motivated this slice.
#   - Day-of-week + force gate for future Sunday-cron triggering — even
#     though slice 1 is manual-only, the gate is wired so the workflow
#     is ready for slice 3's automatic trigger.
#   - Artefacts uploaded as workflow artifacts for manual inspection.
#     R2 push + commit-back come in slice 2 once the user's tested
#     the basic flow.
#
# 2026-05-11: 5a backend swapped from PyMC + blackjax NUTS to R-INLA
# (deterministic Laplace approximation, ~10s fit vs 3h MCMC). The JAX
# XLA_FLAGS env-var + device-count assertion + sampler chain/tune/draws
# overrides are gone — INLA has no warmup, no chains, and is fast enough
# that smoke-test sampler overrides aren't useful. R is now needed by
# BOTH phases (dbarts for 4a, INLA for 5a) so the install step is no
# longer 4a-gated.
#
# Cost ballpark on ubuntu-latest (4 vCPU):
#   - 4a only: ~75-120 min (3 stations × 5 leads, ~5-8 min each BART fit)
#   - 5a only: ~10 min (INLA fit ~30s; bulk is R + INLA install ~5 min)
#   - all:     ~80-130 min

on:
  # Automated path (Sunday): WeatherBlend's previous-runs-refresh fires
  # this on its own success when the Cloudflare worker passes it
  # train_after_refresh=true (the worker only sets that on Sundays).
  # client_payload carries phases + add_spread_features so the same
  # payload shape works for manual-dispatch overrides.
  repository_dispatch:
    types: [retrain]
  # Manual path: user fires from CLI / Actions UI. force=true (default)
  # bypasses any gate.
  workflow_dispatch:
    inputs:
      phases:
        description: "Comma-separated phases to retrain. 'all' = every impl=python phase in WeatherBlend's config/phases.yaml (fetched from R2). Examples: '5a', '4a', '4a,5a'."
        required: false
        default: "all"
        type: string
      anchor:
        description: "Anchor date YYYY-MM-DD UTC for the version string. Empty = today."
        required: false
        type: string
      force:
        description: "Run regardless of trigger source (manual override). Default true."
        required: false
        default: true
        type: boolean
      add_spread_features:
        description: "5a only — DEPRECATED no-op (INLA backend uses the full feature set unconditionally). Retained so old saved-dispatch payloads don't 422."
        required: false
        default: false
        type: boolean
      posterior_draws:
        description: "5a only — joint posterior samples drawn from INLA's Laplace-approximated posterior. Blank = script default (1000). Affects CI sharpness only; fit time is constant."
        required: false
        default: ""
        type: string

concurrency:
  # One slot per (phases, posterior_draws) tuple. Production retrains
  # share the same key per `phases` so the Sunday cron never runs two
  # simultaneous 5a fits that race for the R2 push slot. Custom
  # posterior_draws values get distinct keys so a diagnostic run can sit
  # alongside a production run. Empty input collapses to "default" so
  # the production key shape is stable.
  group: weatherprobabilistic-retrain-${{ inputs.phases }}-${{ inputs.posterior_draws || 'default' }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 6h ceiling for the full sweep. 5a alone ≈ 3h on 4 vCPU; +25 min
    # for 4a; +30 min slack for setup, R install, R2 sync, artifact
    # upload. Job-level timeout fires before GitHub's default 360 min
    # in case anything stalls.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (recover ~17 GB from preinstalled tooling)
        # ubuntu-latest's / partition is 72 GB total but ~73% full at
        # baseline (.NET / Android / CodeQL / Haskell / Chrome / Edge
        # SDKs we don't need). MUST run before Install INLA — sf's source
        # build needs ~3-5 GB temp on /, INLA itself adds ~3-4 GB
        # installed, and the 16 GB swap step later eats another ~16 GB
        # of disk (even on /mnt — / and /mnt are the same partition on
        # current ubuntu-latest images). Without this step the swap
        # allocation lands on a near-full disk and INLA's mkdir under
        # tempdir() fails with "Fail to create directory" — exactly what
        # killed run 25690642625 attempt 5.
        #
        # Verified empty disk-recovery numbers via 5a-runner-smoke run on
        # 2026-05-11: ~17 GB freed (less than the 40-50 GB initial
        # estimate; .NET/Android were smaller than I assumed) but
        # plenty for the install + swap chain.
        run: |
          echo "--- df -h before cleanup ---"
          df -h /
          sudo rm -rf /usr/share/dotnet              || true
          sudo rm -rf /usr/local/lib/android         || true
          sudo rm -rf /opt/ghc                       || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL    || true
          sudo rm -rf /opt/google/chrome             || true
          sudo rm -rf /opt/microsoft/msedge          || true
          sudo apt-get clean
          echo "--- df -h after cleanup ---"
          df -h /

      - name: Decide whether to proceed
        # Gate kept simple now that Cloudflare owns the cadence rule. Three
        # ways this workflow fires; each unambiguously decides:
        #   - repository_dispatch: WB previous-runs-refresh fired us after
        #     a successful Sunday refresh. Cloudflare already gated the
        #     Sunday check at dispatch time. Proceed.
        #   - workflow_dispatch + force=true (default): manual run, user
        #     intent to retrain regardless. Proceed.
        #   - workflow_dispatch + force=false: rare opt-out, e.g. testing
        #     the workflow's wiring without the 3-hour sample. Skip.
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            echo "Triggered via repository_dispatch (Sunday auto-trigger from WB previous-runs-refresh) — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual dispatch with force=true — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::workflow_dispatch with force=false — exiting cleanly (no training)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- rclone setup (moved up so the phase-decide step can fetch
      # phases.yaml from R2 before deciding which phases to run) -----------

      - name: Install rclone
        if: steps.gate.outputs.proceed == 'true'
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Fetch phases.yaml from R2
        # WeatherBlend's previous-runs-refresh workflow pushes
        # src/WeatherBlend/config/phases.yaml to r2:${R2_BUCKET}/config/
        # on every refresh tick, so this is always recent. Cross-repo
        # canonical config without checking out WeatherBlend.
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ./config
          rclone copy "r2:${R2_BUCKET}/config/phases.yaml" ./config/ --checkers 4
          echo "----- phases.yaml -----"
          cat ./config/phases.yaml

      - name: Decide which phases to run
        # Source-of-truth resolution:
        #   - "all" → all impl=python phases listed in phases.yaml.
        #     Adding a new python phase to phases.yaml automatically
        #     wires it into the Sunday default sweep WITHOUT editing this
        #     file's "all" expansion (the historical "INPUT='4a,5a'"
        #     bug-prone hardcoding).
        #   - explicit comma-separated list → exact subset to run.
        #
        # Phase config can come from either trigger:
        #   - workflow_dispatch: inputs.phases (default "all")
        #   - repository_dispatch: client_payload.phases (default "all")
        #
        # NOTE: each phase still needs its own concrete "Train <id>" run
        # block below — the YAML drives the "all" expansion and the
        # validation set, but a new phase still needs the per-phase
        # train invocation. Adding 5b: (1) edit phases.yaml in WB,
        # (2) add a `run_5b` output emit + a `Train 5b` step here.
        id: phases
        if: steps.gate.outputs.proceed == 'true'
        env:
          PHASES_DISPATCH: ${{ inputs.phases }}
          PHASES_PAYLOAD: ${{ github.event.client_payload.phases }}
        run: |
          # yq is pre-installed on ubuntu-latest (mikefarah/yq).
          PYTHON_PHASES=$(yq -r '
            [.targets | to_entries[].value.phases[] | select(.impl == "python") | .id] | join(",")
          ' ./config/phases.yaml)
          echo "impl=python phases from phases.yaml: $PYTHON_PHASES"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT="${PHASES_PAYLOAD:-all}"
          else
            INPUT="${PHASES_DISPATCH:-all}"
          fi
          if [ "$INPUT" = "all" ]; then INPUT="$PYTHON_PHASES"; fi
          echo "Resolved phase list: $INPUT"

          # Per-phase run flags. Each known python phase emits a flag here;
          # unknown phases (in input but absent from phases.yaml) error
          # out. Add a new flag here when wiring a new phase's run block.
          run_4a=false; run_5a=false
          case ",$INPUT," in *,4a,*) run_4a=true ;; esac
          case ",$INPUT," in *,5a,*) run_5a=true ;; esac
          echo "run_4a=$run_4a" >> "$GITHUB_OUTPUT"
          echo "run_5a=$run_5a" >> "$GITHUB_OUTPUT"

          # Validate input against phases.yaml — anything in INPUT that
          # isn't in PYTHON_PHASES is an unknown phase. Catches typos
          # ("5b" before adding 5b to the YAML) and hardcoded "5z" tests.
          IFS=',' read -ra REQUESTED <<< "$INPUT"
          IFS=',' read -ra KNOWN <<< "$PYTHON_PHASES"
          for p in "${REQUESTED[@]}"; do
            found=false
            for k in "${KNOWN[@]}"; do
              if [ "$p" = "$k" ]; then found=true; break; fi
            done
            if [ "$found" = "false" ]; then
              echo "::error::Phase '$p' is not in phases.yaml's impl=python list (have: $PYTHON_PHASES). Add it to phases.yaml first."
              exit 1
            fi
          done

          if [ "$run_4a" = "false" ] && [ "$run_5a" = "false" ]; then
            echo "::error::No phase run-blocks were enabled by input '$INPUT'. If you've added a new phase to phases.yaml, you also need to wire its run_<id>=true emit + Train step in retrain-python.yml."
            exit 1
          fi

      - name: Decide spread-features flag
        # add_spread_features: only honoured for 5a. Same source priority
        # as phases — payload first (Sunday auto path), input second
        # (manual path). Default false until the spread-features model
        # is promoted to production.
        id: spread
        if: steps.gate.outputs.proceed == 'true'
        env:
          SPREAD_DISPATCH: ${{ inputs.add_spread_features }}
          SPREAD_PAYLOAD: ${{ github.event.client_payload.add_spread_features }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FLAG="${SPREAD_PAYLOAD:-false}"
          else
            FLAG="${SPREAD_DISPATCH:-false}"
          fi
          echo "add_spread_features=$FLAG"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      # R is needed by BOTH phases now (dbarts for 4a, INLA for 5a) so
      # apt install runs whenever either flag is set. Per-phase R packages
      # then install conditionally so a 5a-only run skips dbarts and vice
      # versa.
      - name: Install R
        if: steps.gate.outputs.proceed == 'true' && (steps.phases.outputs.run_4a == 'true' || steps.phases.outputs.run_5a == 'true')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base r-base-dev libtirpc-dev python3-dev
          R --version
          mkdir -p ~/R/x86_64-pc-linux-gnu-library/4.4
          echo 'R_LIBS_USER=~/R/x86_64-pc-linux-gnu-library/4.4' >> ~/.Renviron

      - name: Install dbarts (4a)
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4a == 'true'
        run: |
          R -e 'install.packages("dbarts", repos="https://cloud.r-project.org", lib=Sys.getenv("R_LIBS_USER"))'
          R -e 'library(dbarts); cat("dbarts version:", as.character(packageVersion("dbarts")), "\n")'

      - name: Install INLA (5a)
        # Recent INLA versions hard-require fmesher at load time (even for
        # `f(..., 'iid')` random-effect models like ours that don't use
        # any SPDE/mesh functionality). fmesher Imports sf, sf Imports
        # units — and units' configure step needs libudunits2.so. Same
        # transitive chain pulls libgdal/libgeos/libproj for sf itself.
        # Without the apt-installed system libs, the source build of
        # `units` errors out with "Configuration failed because
        # libudunits2.so was not found" and the whole INLA load fails.
        #
        # Past attempts:
        #   - 1st: relied on dep="Imports" to skip sf — INLA loaded
        #     refused with "no package called 'fmesher'".
        #   - 2nd: explicit install.packages("fmesher", ...) without
        #     `dep` — pulled sf/units source builds, units configure
        #     failed on missing libudunits2-dev. (Run 25688568871.)
        #   - 3rd (this one): install the four sf-stack system libs via
        #     apt first, then fmesher source-builds cleanly. ~3-5 min
        #     compile time on top of the existing R install — acceptable
        #     for the Sunday-only retrain cadence.
        #
        # Note: this whole step is required even though the model's
        # formula uses only `f(..., 'iid')`. fmesher is a runtime load
        # dep, not a feature dep. If a future INLA release decouples
        # fmesher again, the system-libs apt + R install can both be
        # dropped.
        #
        # Built-for-R-version warning: the r-inla stable binary is built
        # against R 4.5+ and ubuntu-latest's r-base is 4.4. The warning
        # is benign for the IID random-effects models we use; if a future
        # INLA release breaks ABI we'd need to upgrade R via CRAN apt
        # (the dependency-pull pattern below stays the same).
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_5a == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev
          R -e 'install.packages("fmesher", repos = "https://cloud.r-project.org", lib = Sys.getenv("R_LIBS_USER"))'
          R -e 'options(repos = c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable")); install.packages("INLA", lib = Sys.getenv("R_LIBS_USER"), dep = c("Depends", "Imports"))'
          # `sn` (skew-normal) is in INLA's Suggests, not Imports — so the
          # dep=c("Depends","Imports") above skips it. inla.posterior.sample
          # calls inla.create.sn.cache which inla.require's `sn`; without
          # it, the fit completes but posterior sampling errors with
          # "Package 'sn' is required to proceed, but is not installed."
          # Verified failure mode on run 25698631211 — fit ran 15 min then
          # died at sampling, wasting all that compute. Install sn here so
          # the next retrain doesn't trip the same wall.
          R -e 'install.packages("sn", repos = "https://cloud.r-project.org", lib = Sys.getenv("R_LIBS_USER"))'
          R -e 'library(INLA); library(sn); cat("INLA version:", as.character(packageVersion("INLA")), "  sn version:", as.character(packageVersion("sn")), "\n")'

      - name: Install Python deps
        if: steps.gate.outputs.proceed == 'true'
        env:
          RPY2_CFFI_MODE: ABI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.phases.outputs.run_4a }}" = "true" ]; then
            # rpy2<3.6 because rpy2 3.6+ references R_getVar (R 4.5+)
            # which Ubuntu 24.04's r-base 4.4 doesn't expose. 5a's INLA
            # bridge talks to R via subprocess + CSV (not rpy2) so this
            # is 4a-only.
            pip install 'rpy2<3.6'
          fi

      - name: Pull data trees from R2
        # Both 4a and 5a need the forecast tree + EA truth. Pull once,
        # let each phase consume what it needs.
        if: steps.gate.outputs.proceed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ../WeatherBlend/data/forecasts/location=bonehill_rocks
          for m in gfs_seamless ecmwf_ifs025 icon_seamless meteofrance_seamless gem_seamless ecmwf_aifs025_single jma_seamless; do
            rclone copy "r2:${R2_BUCKET}/data/forecasts/location=bonehill_rocks/model=$m" \
              "../WeatherBlend/data/forecasts/location=bonehill_rocks/model=$m" \
              --fast-list --transfers 16 --checkers 32
          done
          mkdir -p ../WeatherBlend/data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" \
            ../WeatherBlend/data/truth/rainfall \
            --fast-list --transfers 16 --checkers 32

      - name: Train 4a (BART, per-cell)
        # 3 stations × 5 leads = 15 BART fits per run, ~5-8 min each
        # on a 4-vCPU runner. Total wall: ~75-120 min. Per-cell
        # architecture replaced the lead-pooled 4a 2026-05-11 (see
        # train_4a.py module docstring).
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_4a == 'true'
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          R_HOME: /usr/lib/R
          R_LIBS_USER: /home/runner/R/x86_64-pc-linux-gnu-library/4.4
          RPY2_CFFI_MODE: ABI
        run: |
          ANCHOR="${{ inputs.anchor }}"
          ARGS=""
          if [ -n "$ANCHOR" ]; then ARGS="--anchor $ANCHOR"; fi
          python -u scripts/train_4a.py $ARGS

      - name: Add 16 GB swap (5a INLA headroom)
        # INLA 25.10 fitting 175k rows × 18 fixed effects + 18 random-
        # slope blocks peaks well above ubuntu-latest's 7 GB RAM during
        # the latent-field Cholesky. Run 25690642625 OOM-killed at ~50
        # min ("hosted runner lost communication"); first swap-fix
        # attempt (25694883496) failed because the runner ships with
        # an already-active /swapfile and fallocate refused to overwrite
        # it ("Text file busy").
        #
        # Two adjustments vs the first attempt:
        #   1. swapoff the runner's default /swapfile first so we can
        #      free its handle and discard the pre-existing 4 GB swap.
        #   2. Mint the new 16 GB swap on /mnt — the runner's secondary
        #      SSD partition has ~80 GB free (vs ~14 GB on /), so the
        #      file slot is generous and won't compete with R installs
        #      + temporary R subprocess CSVs on /.
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_5a == 'true'
        run: |
          echo "--- swap before ---"
          swapon --show || true
          free -h
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "--- swap after ---"
          swapon --show
          free -h

      - name: Train 5a (Bayesian logreg)
        if: steps.gate.outputs.proceed == 'true' && steps.phases.outputs.run_5a == 'true'
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          R_LIBS_USER: /home/runner/R/x86_64-pc-linux-gnu-library/4.4
          # Run 25695815670 failed at INLA's `*** Fail to create directory`
          # under /tmp — / (~14 GB) is near-full after R + apt + fmesher
          # source-build + Python deps stack. /mnt has ~80 GB free. R reads
          # TMPDIR for tempdir(), and INLA creates its working files under
          # tempdir() — so pointing R at /mnt for tmp keeps both INLA's
          # workspace AND the swap (already on /mnt/swapfile) on the bigger
          # SSD. mkdir guard in the run script below handles first-time
          # directory creation.
          TMPDIR: /mnt/tmp
        run: |
          # /mnt is root-owned on ubuntu-latest (just like /); a plain mkdir
          # without sudo gets EACCES (run 25696864628). Create + chmod 777
          # so R/INLA/Python all write fine as the unprivileged runner user.
          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "--- disk before train ---"
          df -h / /mnt
          df -i / /mnt
          # Two-step: fit posterior, then build live bundle + test
          # predictions parquet. extend_5a depends on the freshly-written
          # posterior NetCDF from run_phase5_bayesian.
          ARGS=""
          if [ "${{ steps.spread.outputs.flag }}" = "true" ]; then
            # No-op under INLA but the flag is accepted for back-compat.
            ARGS="--add-spread-features"
            echo "::notice::--add-spread-features passed but ignored (INLA backend uses full feature set)."
          fi
          DRAWS="${{ inputs.posterior_draws }}"
          if [ -n "$DRAWS" ]; then ARGS="$ARGS --draws $DRAWS"; echo "::notice::Posterior draws override: $DRAWS"; fi
          python -u scripts/run_phase5_bayesian.py $ARGS
          EXTEND_ARGS=""
          if [ "${{ steps.spread.outputs.flag }}" = "true" ]; then
            EXTEND_ARGS="--add-spread-features"
          fi
          python -u scripts/extend_5a.py $EXTEND_ARGS

      # ----- R2 auto-push (2026-05-10) ----------------------------------
      # Slice 1's "upload as workflow artifact only" was always meant to
      # be temporary; user authorised auto-push for both phases after
      # validating the spread-features pilot earlier today. R2 sync is
      # incremental, gated on the train step's success (the guard
      # exited 4 if data drifted, in which case write_bundle never ran
      # and there's nothing to sync). 5a's reports/phase5a_artefacts/
      # tree is the live bundle predict_5a.py reads from on each
      # prediction tick.

      - name: Push 4a bundles to R2
        if: success() && steps.phases.outputs.run_4a == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/precipitation \
            "r2:${R2_BUCKET}/data/models/precipitation" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*phase4a*/**"

      - name: Push 5a bundle to R2
        if: success() && steps.phases.outputs.run_5a == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Whole reports/phase5a_artefacts/ tree: posteriors NetCDF,
          # live_bundle (StandardScaler + metadata), test predictions.
          # predict-5a.yml's "Pull 5a bundle from R2" step copies these
          # back down to ./reports/phase5a_artefacts/ at every predict
          # tick (mirrors predict-4a.yml's bundle-pull pattern).
          rclone copy ./reports/phase5a_artefacts \
            "r2:${R2_BUCKET}/reports/phase5a_artefacts" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket

      - name: Push 5a per-station metadata to R2
        if: success() && steps.phases.outputs.run_5a == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Per-station training_metadata.json + feature_schema.json
          # written by extend_5a.py to ../WeatherBlend/data/models/
          # precipitation/{station}/v..._phase5a/. WeatherBlend's
          # sync-render-inputs composite pulls this prefix into the
          # render step, where LoadModelSummaries discovers 5a as a
          # first-class phase on the Models page + Spec page + verify
          # pipeline. Mirrors the 4a push step above.
          rclone copy ../WeatherBlend/data/models/precipitation \
            "r2:${R2_BUCKET}/data/models/precipitation" \
            --fast-list --transfers 16 --checkers 32 --s3-no-check-bucket \
            --include "**/*phase5a*/**"

      # ----- Workflow artefacts kept as a fallback ----------------------
      # Auto-push above is the production path, but artefact upload stays
      # so a guard-fail / push-fail run still leaves the trained bundle
      # downloadable from the workflow page for manual triage.

      # 4a fallback artefact upload removed 2026-05-11. The bundle dir
      # lives at ../WeatherBlend/data/... which sits OUTSIDE the
      # workflow's checkout, and actions/upload-artifact@v4 rejects
      # paths containing `..` ("Relative pathing not allowed"). R2 push
      # above is the production path; if it fails the run logs are
      # enough to triage. Restoring this fallback would need a `cp -r`
      # to a staging dir inside the workspace first — not worth it.

      - name: Upload 5a artefacts (fallback)
        if: always() && steps.phases.outputs.run_5a == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrain-5a-${{ github.run_id }}
          path: |
            reports/phase5a_artefacts/posteriors/lead_feature.nc
            reports/phase5a_artefacts/live_bundle/
            reports/phase5a_artefacts/predictions/test_predictions_with_ci.parquet
          retention-days: 14
          if-no-files-found: warn

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-python-logs-${{ github.run_id }}
          path: |
            *.log
            reports/*.log
          retention-days: 7
          if-no-files-found: ignore
