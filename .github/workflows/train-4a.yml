name: train-4a

env:
  # rclone hang guard — every R2 transfer in this workflow inherits these.
  # A failed/stalled transfer retries hard and a dead connection times out
  # fast, instead of hanging silently to the job ceiling (a job timeout
  # surfaces as a `cancelled` run, easy to miss).
  RCLONE_TIMEOUT: 5m
  RCLONE_CONTIMEOUT: 1m
  RCLONE_LOW_LEVEL_RETRIES: "20"
  RCLONE_RETRIES: "5"

# Phase 4a (dbarts BART) TRAINING ONLY — fits the precip P(wet) blender
# once and writes a versioned bundle (state.rds + arrays.npz +
# preprocess.json + training_metadata.json + feature_schema.json) to R2.
# predict-4a.yml then loads that bundle on the 6-hourly cycle.
#
# Pre-split, train+predict ran together in predict-4a.yml on a daily
# cron (~24 min wall) because earlier (incorrect) experiments suggested
# dbarts trees couldn't survive saveRDS. We later verified the round-
# trip works bit-exactly via storeState() + setState() (see
# scripts/smoke_dbarts_roundtrip.py and the reference memory). Splitting
# unlocks 6-hourly predict refresh while training stays at training cost.
#
# Trigger: workflow_dispatch only by default — the model is stable
# enough to retrain on demand rather than on a cron. Add a weekly cron
# here if drift becomes a concern; the first thing to watch is the
# rolling Brier on the Models card.
#
# Cost: ~24 min wall (3 stations × ~8 min each, 84k pooled rows per fit
# at champion config ntree=500, ndpost=1000).

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "Anchor date YYYY-MM-DD (UTC) for the version string. Empty = today."
        required: false
        type: string
      stations:
        description: "Comma-separated station slugs (default: all 3 active)."
        required: false
        type: string

concurrency:
  # train-4a writes versioned dirs under data/models/precipitation/.../v*_phase4a/.
  # Two same-day runs would just produce two adjacent versions; the predict
  # side picks the latest by lexicographic name. Still, serialise to keep
  # R2 consistent and avoid wasted compute.
  group: weatherprobabilistic-train-4a
  cancel-in-progress: false

jobs:
  train-4a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R + dbarts
        # Same install incantation as predict-4a.yml. R must land BEFORE
        # rpy2 (rpy2's wheel build sniffs `R RHOME` at install time);
        # libtirpc-dev + python3-dev satisfy rpy2-rinterface's link check
        # even in ABI mode.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base r-base-dev libtirpc-dev python3-dev
          R --version
          mkdir -p ~/R/x86_64-pc-linux-gnu-library/4.4
          echo 'R_LIBS_USER=~/R/x86_64-pc-linux-gnu-library/4.4' >> ~/.Renviron
          R -e 'install.packages("dbarts", repos="https://cloud.r-project.org", lib=Sys.getenv("R_LIBS_USER"))'
          R -e 'library(dbarts); cat("dbarts version:", as.character(packageVersion("dbarts")), "\n")'

      - name: Install Python deps
        # rpy2<3.6 because rpy2 3.6+ references R_getVar (R 4.5+) which
        # Ubuntu 24.04's r-base 4.4 doesn't expose; ABI mode skips the
        # native build that needs libR-dev linker config.
        env:
          RPY2_CFFI_MODE: ABI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'rpy2<3.6'

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Pull forecast tree + EA truth from R2
        # Training needs both: the 7-NWP forecast tree (offset_day archive
        # for historical features) AND the EA rainfall truth for labels.
        # predict-4a.yml drops the truth pull because predict-time has no
        # labels to join.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p ../WeatherBlend/data/forecasts/location=bonehill_rocks
          for m in gfs_seamless ecmwf_ifs025 icon_seamless meteofrance_seamless gem_seamless ecmwf_aifs025_single jma_seamless; do
            rclone copy "r2:${R2_BUCKET}/data/forecasts/location=bonehill_rocks/model=$m" \
              "../WeatherBlend/data/forecasts/location=bonehill_rocks/model=$m" \
              --fast-list --transfers 16 --checkers 32
          done
          mkdir -p ../WeatherBlend/data/truth/rainfall
          rclone copy "r2:${R2_BUCKET}/data/truth/rainfall" \
            ../WeatherBlend/data/truth/rainfall \
            --fast-list --transfers 16 --checkers 32

      - name: Run Phase 4a training
        # ~24 min wall (3 stations sequentially). Emits one bundle dir
        # per station under ../WeatherBlend/data/models/precipitation/{station}/v..._phase4a/.
        env:
          WEATHERBLEND_DATA_ROOT: ${{ github.workspace }}/../WeatherBlend/data
          R_HOME: /usr/lib/R
          R_LIBS_USER: /home/runner/R/x86_64-pc-linux-gnu-library/4.4
          RPY2_CFFI_MODE: ABI
        run: |
          ANCHOR="${{ github.event.inputs.anchor }}"
          STATIONS="${{ github.event.inputs.stations }}"
          ARGS=""
          if [ -n "$ANCHOR" ]; then ARGS="$ARGS --anchor $ANCHOR"; fi
          if [ -n "$STATIONS" ]; then
            STATIONS_LIST=$(echo "$STATIONS" | tr ',' ' ')
            ARGS="$ARGS --stations $STATIONS_LIST"
          fi
          python -u scripts/train_4a.py $ARGS

      - name: Push Phase 4a model bundles to R2
        # Only the models tree — predictions are predict-4a.yml's job.
        # The version dir contains state.rds + arrays.npz + preprocess.json
        # alongside the existing training_metadata.json + feature_schema.json
        # files the WeatherBlend renderer already reads.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ../WeatherBlend/data/models/precipitation \
            "r2:${R2_BUCKET}/data/models/precipitation" \
            --include '**/*phase4a*/**' \
            --fast-list --transfers 16 --checkers 32 --progress

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: train-4a-${{ github.run_id }}
          path: |
            *.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
